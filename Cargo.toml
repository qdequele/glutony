[workspace]
resolver = "2"
members = [
    "crates/gateway",
    "crates/control-plane",
    "crates/worker",
    "crates/router",
    "crates/blob",
    "crates/plugin-sdk",
    "crates/usage",
    "crates/plugin-runtime",
    "crates/source",
    "crates/plugins/pdf",
    "crates/plugins/docx",
    "crates/plugins/xlsx",
    "crates/plugins/html",
    "crates/plugins/markdown",
    "crates/plugins/csv",
    "crates/plugins/json",
    "crates/plugins/chunker",
    "crates/plugins/meili-indexer",
    "crates/plugins/llm-enricher",
    "crates/plugins/image-captioner",
    "crates/plugins/pptx",
    "crates/plugins/audio-transcriber",
    "crates/plugins/video-audio",
    "crates/plugins/msgpack",
    "crates/plugins/avro",
    "crates/plugins/parquet",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meilisearch/meili-ingest"
rust-version = "1.94"

[workspace.dependencies]
# internal
meili-ingest-plugin-sdk = { path = "crates/plugin-sdk", version = "0.1.0" }
meili-ingest-router = { path = "crates/router" }
meili-ingest-blob = { path = "crates/blob" }
meili-ingest-usage = { path = "crates/usage" }
meili-ingest-plugin-runtime = { path = "crates/plugin-runtime" }
meili-ingest-plugin-pdf = { path = "crates/plugins/pdf" }
meili-ingest-plugin-docx = { path = "crates/plugins/docx" }
meili-ingest-plugin-xlsx = { path = "crates/plugins/xlsx" }
meili-ingest-plugin-html = { path = "crates/plugins/html" }
meili-ingest-plugin-markdown = { path = "crates/plugins/markdown" }
meili-ingest-plugin-csv = { path = "crates/plugins/csv" }
meili-ingest-plugin-json = { path = "crates/plugins/json" }
meili-ingest-plugin-chunker = { path = "crates/plugins/chunker" }
meili-ingest-plugin-meili-indexer = { path = "crates/plugins/meili-indexer" }
meili-ingest-plugin-llm-enricher = { path = "crates/plugins/llm-enricher" }
meili-ingest-plugin-image-captioner = { path = "crates/plugins/image-captioner" }
meili-ingest-plugin-pptx = { path = "crates/plugins/pptx" }
meili-ingest-plugin-audio-transcriber = { path = "crates/plugins/audio-transcriber" }
meili-ingest-plugin-video-audio = { path = "crates/plugins/video-audio" }
meili-ingest-plugin-msgpack = { path = "crates/plugins/msgpack" }
meili-ingest-plugin-avro = { path = "crates/plugins/avro" }
meili-ingest-plugin-parquet = { path = "crates/plugins/parquet" }
meili-ingest-source = { path = "crates/source" }

# async / runtime
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# http
axum = { version = "0.8", features = ["multipart", "macros", "json", "query"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout", "request-id"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
url = "2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.23"
bytes = "1"

# scheduled sources: sealed secrets, change detection, transparent gzip, cron timezones
chacha20poly1305 = "0.10"
rand = "0.9"
blake3 = "1"
flate2 = "1"
chrono-tz = "0.10"

# temporal
temporalio-sdk = "1.0"
temporalio-client = "1.0"
temporalio-common = "1.0"
temporalio-macros = "1.0"
temporalio-workflow = "1.0"
# Pulled in only to turn on `vendored-protox`, which makes Temporal's build compile
# its protos with the pure-Rust `protox` instead of shelling out to a `protoc` binary.
temporalio-protos = { version = "0.9", features = ["vendored-protox"] }

# database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

# storage
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }

# search
meilisearch-sdk = "0.33"

# detection / parsing
infer = "0.22"
mime_guess = "2"
# Compiles the exported admin UI into the gateway binary (feature `ui`).
rust-embed = { version = "8", features = ["mime-guess"] }
globset = "0.4"
regex = "1"
serde_json_path = "0.7"
pdf-extract = "0.12"
lopdf = "0.45"
docx-rs = { version = "0.4", default-features = false }
calamine = "0.36"
scraper = "0.27"
pulldown-cmark = "0.13"
csv = "1.4"
# Binary record formats. `rmpv` reads MessagePack without a schema, `apache-avro`
# reads Object Container Files, and `parquet` is used through its Arrow reader.
rmpv = "1.3"
rmp-serde = "1.3"
apache-avro = { version = "0.22", features = ["snappy", "zstandard"] }
# Codecs only, no CLI/async: `flate2-rust_backend` keeps deflate pure-Rust
# (the bare `flate2` feature leaves the zlib backend unchosen and fails to build).
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd", "base64"] }
arrow-array = "59"
arrow-schema = "59"
arrow-json = "59"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "mkv", "ogg", "wav", "aac", "mp3", "alac", "flac", "vorbis", "pcm"] }
hound = "3.5"
rubato = "5.0"

# plugin runtime
extism = "1.30"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Pure-Rust protobuf compiler: lets build scripts compile .proto files without a
# `protoc` binary on the machine.
protox = "0.9"
prost = "0.14"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# testing
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
