[package]
name = "meili-ingest-gateway"
description = "HTTP gateway for meili-ingest: resolves the tenant context, detects content, picks a pipeline and starts the Temporal workflow."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "meili-ingest-gateway"
path = "src/main.rs"

[lib]
name = "meili_ingest_gateway"
path = "src/lib.rs"

[features]
default = []
# Compile the Next.js static export at `ui/out` into the binary and serve it at /ui.
# Requires `pnpm build` in `ui/` first; without the feature the gateway is API-only.
ui = ["dep:rust-embed"]

[dependencies]
# internal
meili-ingest-plugin-sdk.workspace = true
meili-ingest-router.workspace = true
meili-ingest-blob.workspace = true

# http
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest = { workspace = true, features = ["query"] }

# async
tokio.workspace = true
async-trait.workspace = true

# serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bytes.workspace = true

# temporal
temporalio-client.workspace = true
temporalio-common.workspace = true

# misc
uuid.workspace = true
chrono.workspace = true
mime_guess.workspace = true
# Only pulled in with the `ui` feature: embeds the exported admin UI.
rust-embed = { workspace = true, optional = true }

# errors / logging
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock.workspace = true
tower = { workspace = true, features = ["util"] }
