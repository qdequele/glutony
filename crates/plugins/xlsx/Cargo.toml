[package]
name = "meili-ingest-plugin-xlsx"
description = "meili-ingest built-in plugin: extracts rows or sheets from Excel / ODS spreadsheets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
meili-ingest-plugin-sdk.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
calamine = { workspace = true, features = ["dates"] }
# calamine enables chrono without default features; we need std for `format()`.
chrono.workspace = true

[dev-dependencies]
rust_xlsxwriter = "0.99"
tokio = { workspace = true, features = ["macros", "rt"] }
