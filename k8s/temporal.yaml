# ============================================================================
# REFERENCE ONLY — NOT FOR PRODUCTION
# ============================================================================
# A single-pod Temporal server (temporalio/auto-setup) backed by a single
# Postgres pod, so the whole stack can be brought up on a dev/staging cluster
# with `kubectl apply -k k8s/`.
#
# In production use Temporal Cloud (https://temporal.io/cloud) or the official
# Helm chart (https://github.com/temporalio/helm-charts) with an HA database,
# and set TEMPORAL_URL / TEMPORAL_NAMESPACE (+ mTLS certificates) in the
# meili-ingest-config ConfigMap accordingly. Remove this file from
# kustomization.yaml when you do.
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: temporal-postgres
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              value: temporal          # dev only
            - name: POSTGRES_DB
              value: temporal
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.27
          ports:
            - name: grpc
              containerPort: 7233
            - name: metrics
              containerPort: 8000
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: temporal-postgres
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              value: temporal
            - name: DEFAULT_NAMESPACE
              value: default
            - name: DEFAULT_NAMESPACE_RETENTION
              value: 72h
            - name: PROMETHEUS_ENDPOINT
              value: 0.0.0.0:8000
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/development-sql.yaml
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# Name matches the default TEMPORAL_URL (http://temporal-frontend:7233).
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: temporal
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.34.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: TEMPORAL_CORS_ORIGINS
              value: http://localhost:3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: meili-ingest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
