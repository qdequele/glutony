# kubectl apply -k k8s/
#
# The Secret `meili-ingest-secrets` is not part of this kustomization: create it
# once before the first apply (see secrets.example.yaml, never apply that file as
# is), so re-applying never resets it.
#
# Everything is deployed into the `meili-ingest` namespace from the single
# image ghcr.io/qdequele/glutony. Override the tag with:
#   kustomize edit set image ghcr.io/qdequele/glutony=ghcr.io/qdequele/glutony:0.1.0
#
# temporal.yaml is a non-production reference (single-pod auto-setup). Remove
# it and point TEMPORAL_URL at Temporal Cloud / your own cluster in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meili-ingest

resources:
  - namespace.yaml
  - control-plane.yaml
  - gateway.yaml
  - workers.yaml
  - temporal.yaml

# Provider cost table, mounted into the workers at /etc/meili-ingest
# (PROVIDER_COSTS_FILE in the ConfigMap). Edit k8s/provider-costs.toml.
configMapGenerator:
  - name: meili-ingest-provider-costs
    files:
      - provider-costs.toml
    options:
      disableNameSuffixHash: true

images:
  - name: ghcr.io/qdequele/glutony
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: meili-ingest
