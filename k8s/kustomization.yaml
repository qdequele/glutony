# kubectl apply -k k8s/
#
# The Secret `meili-ingest-secrets` is not part of this kustomization: create it
# once before the first apply (see secrets.example.yaml, never apply that file as
# is), so re-applying never resets it.
#
# Everything is deployed into the `meili-ingest` namespace from the single
# image ghcr.io/qdequele/glutony, at the release `newTag` below pins.
# scripts/prepare-release.sh writes it with every release and CI's `version
# sync` job fails when it is not the crate version, so do not edit it by hand:
# apply the tree of the release you deploy. A moving tag such as `latest` would
# leave nodes on the image they cached (the Deployments use IfNotPresent).
#
# temporal.yaml is a non-production reference (single-pod auto-setup). Remove
# it and point TEMPORAL_URL at your own cluster in production (no TLS or
# authentication on the connection: Temporal Cloud is not supported yet).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meili-ingest

resources:
  - namespace.yaml
  - control-plane.yaml
  - gateway.yaml
  - workers.yaml
  - temporal.yaml

# Provider cost table, mounted into the workers at /etc/meili-ingest
# (PROVIDER_COSTS_FILE in the ConfigMap). Edit k8s/provider-costs.toml.
configMapGenerator:
  - name: meili-ingest-provider-costs
    files:
      - provider-costs.toml
    options:
      disableNameSuffixHash: true

images:
  - name: ghcr.io/qdequele/glutony
    newTag: 0.1.0

commonLabels:
  app.kubernetes.io/part-of: meili-ingest

# One-time, when upgrading from a release without CONTROL_PLANE_TOKEN (see
# "Upgrading to Lab contract v2" in docs/deployment/kubernetes.mdx): uncomment
# to run the control plane with the token not enforced while the gateway and
# workers roll, then comment it out again and re-apply.
# patches:
#   - target:
#       kind: Deployment
#       name: meili-control-plane
#     patch: |-
#       - op: test
#         path: /spec/template/spec/containers/0/env/3/name
#         value: CONTROL_PLANE_TOKEN
#       - op: replace
#         path: /spec/template/spec/containers/0/env/3
#         value:
#           name: CONTROL_PLANE_TOKEN_DISABLED
#           value: "true"
