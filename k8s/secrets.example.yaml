# EXAMPLE ONLY: never `kubectl apply` this file as is.
#
# It documents every key of the `meili-ingest-secrets` Secret the manifests read.
# It is deliberately NOT listed in kustomization.yaml: `kubectl apply -k k8s/`
# never touches the Secret, so upgrades cannot reset real values to CHANGE_ME or
# drop keys only your Secret has. The binaries refuse to boot on CHANGE_ME for
# CONTROL_PLANE_TOKEN, ADMIN_API_KEY and ENVOY_TRUSTED_HEADER.
#
# Create the Secret once, before the first `kubectl apply -k k8s/`:
#
#   kubectl create namespace meili-ingest
#   kubectl -n meili-ingest create secret generic meili-ingest-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@postgres:5432/meili_ingest' \
#     --from-literal=LLM_API_KEY='sk-...' \
#     --from-literal=TINYBIRD_TOKEN='p.ey...' \
#     --from-literal=ENVOY_TRUSTED_HEADER='<shared secret agreed with the Envoy team>' \
#     --from-literal=CONTROL_PLANE_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SOURCE_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=ADMIN_API_KEY="$(openssl rand -hex 32)"
#
# Save the generated SOURCE_SECRET_KEY somewhere safe (a password manager or your
# secret store): losing it makes every sealed Meilisearch key and source
# credential unreadable.
#
# Change one key later with `kubectl -n meili-ingest patch secret ...`, then
# restart the pods (env is read at pod start):
#
#   kubectl -n meili-ingest rollout restart deployment/meili-control-plane \
#     deployment/meili-gateway deployment/workers-general deployment/workers-llm \
#     deployment/workers-gpu
#
# Or copy this file out of the repository, fill it, and apply that copy once.
---
apiVersion: v1
kind: Secret
metadata:
  name: meili-ingest-secrets
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: meili-ingest
    app.kubernetes.io/part-of: meili-ingest
type: Opaque
stringData:
  # --- placeholders: replace every CHANGE_ME with your own value ---
  DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres:5432/meili_ingest"
  LLM_API_KEY: "CHANGE_ME"
  # Tinybird append token for the usage data source. Omit the key entirely to run
  # without usage analytics: the worker logs it once and the reporting step no-ops.
  TINYBIRD_TOKEN: "CHANGE_ME"
  # TypeSafe key for jev_enricher. Optional: omit it to run without the plugin.
  TYPESAFE_API_KEY: "CHANGE_ME"
  # Speech-to-text endpoint key for whisper_transcriber; falls back to LLM_API_KEY.
  TRANSCRIBE_API_KEY: "CHANGE_ME"
  # Shared secret Envoy must send in `X-Meili-Envoy-Secret` for X-Meili-*
  # headers to be honoured. Omit it to trust headers unconditionally (dev only;
  # the gateway refuses to boot without it once LAB_* or LAB_SERVICE_TOKEN is set).
  ENVOY_TRUSTED_HEADER: "CHANGE_ME"
  # Control plane <-> gateway/workers, on /internal/* only. Generate with
  # `openssl rand -hex 32`.
  CONTROL_PLANE_TOKEN: "CHANGE_ME"
  # Seals stored Meilisearch keys and source credentials. Must be 32 bytes, base64:
  # generate with `openssl rand -base64 32`, set it once, keep a copy, and never
  # rotate it casually (keys sealed with the old value can no longer be opened).
  # Commented out because a placeholder is not valid base64 and would stop the
  # gateway and workers from booting; without it /connections answers 501 and
  # connection-based steps fail.
  # SOURCE_SECRET_KEY: "<openssl rand -base64 32>"
  # Operator bearer for the management routes. Never reuse it as the Lab credential.
  ADMIN_API_KEY: "CHANGE_ME"
  # Meilisearch Lab. The operator mints the instance credentials in the Lab with
  # `bin/rails lab:hosted_engine:create PRODUCT=glutony CREDENTIAL=... EDGE_SECRET=...`,
  # which prints LAB_URL, LAB_INSTANCE_ID and LAB_INSTANCE_SECRET once:
  #   CREDENTIAL=  is LAB_SERVICE_TOKEN below (openssl rand -hex 32), the bearer the
  #                Lab presents on the gateway's management routes;
  #   EDGE_SECRET= is ENVOY_TRUSTED_HEADER above.
  # Uncomment together with LAB_URL in the ConfigMap: the gateway and the control
  # plane refuse to boot with only some of the three LAB_* values set.
  # LAB_INSTANCE_ID: "<from the Lab>"
  # LAB_INSTANCE_SECRET: "<from the Lab>"
  # LAB_SERVICE_TOKEN: "<openssl rand -hex 32>"
