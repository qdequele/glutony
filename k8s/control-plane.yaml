# Control plane: pipeline registry + routing API (internal, port 9000).
#
# This file also carries the ConfigMap and Secret shared by every meili-ingest
# component (gateway, workers). Replace the Secret placeholders before applying:
#
#   kubectl -n meili-ingest create secret generic meili-ingest-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@postgres:5432/meili_ingest' \
#     --from-literal=LLM_API_KEY='sk-...' \
#     --from-literal=TINYBIRD_TOKEN='p.ey...' \
#     --from-literal=ENVOY_TRUSTED_HEADER='<shared secret agreed with the Envoy team>' \
#     --from-literal=CONTROL_PLANE_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=SOURCE_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=ADMIN_API_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To report to a Meilisearch Lab, also add the two Lab credentials (printed once
# by `bin/rails lab:hosted_engine:create PRODUCT=glutony ...` in the Lab) and set
# LAB_URL in the ConfigMap below. The three Lab values go together:
#
#     --from-literal=LAB_INSTANCE_ID='<from the Lab>' \
#     --from-literal=LAB_INSTANCE_SECRET='<from the Lab>' \
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meili-ingest-config
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: meili-ingest
data:
  RUST_LOG: "info"
  # Temporal frontend. Use your Temporal Cloud endpoint in production
  # (e.g. https://<namespace>.<account>.tmprl.cloud:7233) together with mTLS.
  TEMPORAL_URL: "http://temporal-frontend:7233"
  TEMPORAL_NAMESPACE: "default"
  CONTROL_PLANE_URL: "http://meili-control-plane:9000"
  # Shared blob store for staged uploads / spilled step outputs. Pods do not
  # share a disk, so use an object store (s3://, gs://, az://). Credentials come
  # from the standard provider env vars / workload identity (IRSA, GKE WI, ...).
  BLOB_STORE_URL: "s3://meili-ingest-blobs"
  INLINE_MAX_BYTES: "1048576"
  PAYLOAD_SPILL_BYTES: "1048576"
  DEFAULT_INDEX: "documents"
  MAX_UPLOAD_MB: "500"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  TRANSCRIBE_MODEL: "whisper-1"
  # Per-tenant usage analytics (Tinybird). Use the base URL of your workspace's
  # region: api.tinybird.co, api.eu-central-1.aws.tinybird.co, and so on.
  TINYBIRD_BASE_URL: "https://api.tinybird.co"
  TINYBIRD_DATASOURCE: "meili_ingest_usage"
  # Meilisearch Lab (platform contract v2). Leave LAB_URL empty to run without a Lab.
  LAB_URL: ""
  # Workers write one usage and one lifecycle event per Lab job to the outbox.
  LAB_EVENTS_ENABLED: "false"
  # Provider cost table mounted from the meili-ingest-provider-costs ConfigMap.
  PROVIDER_COSTS_FILE: "/etc/meili-ingest/provider-costs.toml"
---
apiVersion: v1
kind: Secret
metadata:
  name: meili-ingest-secrets
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: meili-ingest
type: Opaque
stringData:
  # --- placeholders: override with your own values ---
  DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres:5432/meili_ingest"
  LLM_API_KEY: "CHANGE_ME"
  # Tinybird append token for the usage data source. Omit the key entirely to run
  # without usage analytics: the worker logs it once and the reporting step no-ops.
  TINYBIRD_TOKEN: "CHANGE_ME"
  # TypeSafe key for jev_enricher. Optional: omit it to run without the plugin.
  TYPESAFE_API_KEY: "CHANGE_ME"
  # Speech-to-text endpoint key for whisper_transcriber; falls back to LLM_API_KEY.
  TRANSCRIBE_API_KEY: "CHANGE_ME"
  # Shared secret Envoy must send in `X-Meili-Envoy-Secret` for X-Meili-*
  # headers to be honoured. Leave empty to trust headers unconditionally (dev only).
  ENVOY_TRUSTED_HEADER: "CHANGE_ME"
  # Control plane <-> gateway/workers. Generate with `openssl rand -hex 32`.
  CONTROL_PLANE_TOKEN: "CHANGE_ME"
  # Seals stored Meilisearch keys and source credentials: `openssl rand -base64 32`.
  SOURCE_SECRET_KEY: "CHANGE_ME"
  # Operator bearer for the management routes.
  ADMIN_API_KEY: "CHANGE_ME"
  # Meilisearch Lab credentials. The operator mints them in the Lab with
  # `bin/rails lab:hosted_engine:create PRODUCT=glutony ...`, which prints LAB_URL,
  # LAB_INSTANCE_ID and LAB_INSTANCE_SECRET once. Uncomment together with LAB_URL
  # in the ConfigMap to report to a Meilisearch Lab: the gateway and the control
  # plane refuse to boot with only some of the three set.
  # LAB_INSTANCE_ID: "CHANGE_ME"
  # LAB_INSTANCE_SECRET: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meili-control-plane
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: meili-control-plane
    app.kubernetes.io/component: control-plane
spec:
  # Two replicas: the Lab events sender leases rows with FOR UPDATE SKIP LOCKED, so both can run it.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: meili-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meili-control-plane
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: control-plane
          image: ghcr.io/qdequele/glutony:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/meili-ingest-control-plane"]
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: BIND
              value: "0.0.0.0:9000"
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: meili-ingest-config
                  key: RUST_LOG
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: DATABASE_URL
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: CONTROL_PLANE_TOKEN
            - name: LAB_URL
              valueFrom:
                configMapKeyRef:
                  name: meili-ingest-config
                  key: LAB_URL
                  optional: true
            - name: LAB_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: LAB_INSTANCE_ID
                  optional: true
            - name: LAB_INSTANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: LAB_INSTANCE_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: meili-control-plane
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: meili-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meili-control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
