# Worker pools: one Deployment per Temporal task queue, each scaled by KEDA on
# the queue backlog.
#
#   workers-general  every plugin: extractors, parsers, chunker, meili_indexer,
#                    video_audio_extractor, and the AI steps, which call hosted
#                    APIs and need a key:
#                      llm_enricher, image_captioner   LLM_API_KEY
#                      jev_enricher                    TYPESAFE_API_KEY
#                      whisper_transcriber             TRANSCRIBE_API_KEY
#                                                      (falls back to LLM_API_KEY)
#                    ocr and other external plugins load via EXTERNAL_PLUGINS.
#
# No model runs inside a worker, so AI steps need no dedicated (LLM or GPU) pool.
# A plugin whose key is missing registers as unavailable; the rest still run.
#
# Scaling metric
# --------------
# The ScaledObjects below use KEDA's `prometheus` trigger against the backlog
# gauge exported by the Temporal *server* (matching service):
#
#     approximate_backlog_count{taskqueue="workers-general"}
#
# Metric and label names depend on your Temporal server version and on how
# Prometheus scrapes it (the label may be `task_queue` or `taskqueue`, some
# setups prefix metrics with `temporal_`). Check `/metrics` on the matching
# service and adjust the `query`. Two alternatives are documented in comments:
#   * SDK-side schedule-to-start latency (`temporal_activity_schedule_to_start_latency`),
#     which every worker exports itself;
#   * KEDA's native `temporal` scaler (KEDA >= 2.15), which reads the backlog
#     straight from Temporal's DescribeTaskQueue API and needs no Prometheus.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers-general
  namespace: meili-ingest
  labels:
    app.kubernetes.io/name: workers-general
    app.kubernetes.io/component: worker
    meili-ingest/task-queue: workers-general
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workers-general
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workers-general
        app.kubernetes.io/component: worker
        meili-ingest/task-queue: workers-general
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/qdequele/glutony:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/meili-ingest-worker"]
          env:
            - name: TASK_QUEUE
              value: workers-general
            - name: MAX_CONCURRENT_ACTIVITIES
              value: "20"
            # AI step keys. All optional: without one, the matching plugins
            # register as unavailable and the pod still serves everything else.
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: LLM_API_KEY
                  optional: true
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: TYPESAFE_API_KEY
                  optional: true
            - name: TRANSCRIBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: TRANSCRIBE_API_KEY
                  optional: true
            # Usage analytics. Optional: without the key the reporting step no-ops.
            - name: TINYBIRD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: TINYBIRD_TOKEN
                  optional: true
            # Presented on every control-plane call.
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: CONTROL_PLANE_TOKEN
            # Opens stored Meilisearch connection keys.
            - name: SOURCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: meili-ingest-secrets
                  key: SOURCE_SECRET_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: meili-ingest-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: provider-costs
              mountPath: /etc/meili-ingest
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: provider-costs
          configMap:
            name: meili-ingest-provider-costs
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workers-general
  namespace: meili-ingest
spec:
  scaleTargetRef:
    name: workers-general
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        # Activities waiting in the queue. Scale so that each replica handles ~10.
        query: sum(approximate_backlog_count{taskqueue="workers-general"})
        threshold: "10"
        activationThreshold: "0"
    # Alternative: SDK-exported schedule-to-start latency (p95 over 2 min, in seconds).
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    #     query: histogram_quantile(0.95, sum(rate(temporal_activity_schedule_to_start_latency_bucket{task_queue="workers-general"}[2m])) by (le))
    #     threshold: "5"
    # Alternative: KEDA native Temporal scaler (KEDA >= 2.15), no Prometheus needed.
    # - type: temporal
    #   metadata:
    #     endpoint: temporal-frontend.meili-ingest.svc.cluster.local:7233
    #     namespace: default
    #     taskQueue: workers-general
    #     queueTypes: activity
    #     targetQueueSize: "10"
    #     activationTargetQueueSize: "0"
