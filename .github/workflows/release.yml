name: Release

# Runs on a `vX.Y.Z` tag: release-on-merge.yml calls it when a
# `chore(release): vX.Y.Z` PR merges (see CONTRIBUTING.md, "Releasing"); a tag
# pushed by hand runs it too (recovery only). Builds and pushes the multi-arch
# image, creates the GitHub release with the tag's CHANGELOG section as notes,
# then notifies meilisearch/lab (`glutony-released`) so its Contracts sync
# re-vendors docs/openapi.yaml (only with the LAB_DISPATCH_TOKEN secret).
#
# Nothing is published until the `verify` job has checked the tagged tree is
# the release the tag names (scripts/prepare-release.sh --verify-tag): a tag
# made without merging the release PR, pushed by hand or created from the
# GitHub "Draft a new release" form, stops there: no image, no `latest`, no
# Lab dispatch (a release published from that form stays, without an image).
# That is how v0.2.0 shipped a 0.1.0 tree as `0.2.0` and `latest`.
#
# Production on the Lab's box does not deploy these images: it builds every
# green `main` commit from source (qdq-server glutony/autodeploy.sh).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to release (already pushed)"
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/qdequele/glutony
  # The tag being released: the pushed tag, or the caller's input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify the tag is a prepared release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: scripts/prepare-release.sh --verify-tag "$RELEASE_TAG"

  # One native build per architecture (no QEMU: an emulated release build of this
  # workspace takes hours), each pushed by digest, then merged into one multi-arch tag.
  # linux/arm64 is what AWS Graviton runs.
  build:
    name: Build ${{ matrix.platform }}
    needs: [verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.name }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.arch.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Push the multi-arch image
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `value`: under workflow_call github.ref is the PR's, not the tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Check both architectures are published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | contains(["amd64", "arm64"])'
      - name: Smoke test the pushed image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for bin in meili-ingest-gateway meili-ingest-control-plane meili-ingest-worker; do
            docker run --rm --entrypoint /usr/bin/test "$IMAGE:$VERSION" -x /usr/local/bin/$bin
          done

  release:
    name: GitHub release
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.image.outputs.version }}
          LATEST: ${{ !contains(env.RELEASE_TAG, '-') && ' (also `latest`)' || '' }}
        run: |
          {
            scripts/prepare-release.sh --notes "$RELEASE_TAG"
            echo
            echo "Image: \`$IMAGE:$VERSION\`$LATEST."
          } > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/notes.md

  # A failed dispatch never fails a published release: the Lab's daily
  # Contracts sync catches up anyway.
  notify-lab:
    name: notify the Lab
    needs: [release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send repository_dispatch glutony-released to meilisearch/lab
        env:
          LAB_DISPATCH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$LAB_DISPATCH_TOKEN" ]; then
            echo "::notice::LAB_DISPATCH_TOKEN is not set; skipping the Lab notification (its daily contracts run will pick up $RELEASE_TAG)"
            exit 0
          fi
          payload=$(printf '{"event_type":"glutony-released","client_payload":{"tag":"%s","version":"%s"}}' "$RELEASE_TAG" "${RELEASE_TAG#v}")
          code=$(curl -sS -o "$RUNNER_TEMP/dispatch.out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LAB_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/meilisearch/lab/dispatches -d "$payload" || true)
          if [ "$code" = "204" ]; then
            echo "notified meilisearch/lab of $RELEASE_TAG"
          else
            echo "::warning::could not notify meilisearch/lab (HTTP ${code:-none}): $(head -c 300 "$RUNNER_TEMP/dispatch.out" 2>/dev/null)"
          fi
