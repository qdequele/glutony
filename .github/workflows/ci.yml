name: CI

on:
  push:
    branches: [main]
  pull_request:
  # prepare-release.yml dispatches CI on the release branch: a PR opened with
  # GITHUB_TOKEN gets no pull_request run of its own.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release invariant: the crate version (Cargo.toml package and pinned
  # path dependencies, Cargo.lock), docs/openapi.yaml info.version and the
  # k8s/kustomization.yaml image newTag agree.
  # Also tests the release script itself (scripts/test-prepare-release.sh).
  version-sync:
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/prepare-release.sh --check
      - run: scripts/test-prepare-release.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meili_ingest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the control-plane DB tests (they skip without it).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/meili_ingest_test
      # Enables the Temporal-backed tests (schedules_temporal, archive_temporal,
      # source_run_temporal) against the dev server started below. They skip
      # without it locally, and fail without it when `CI` is set.
      TEMPORAL_TEST_URL: http://127.0.0.1:7233
      TEMPORAL_CLI_VERSION: 1.10.1
      TEMPORAL_CLI_SHA256: 4c1500e2ce2d4de136e5fe8852d9b7f82eb62f19b6b383b3e0c040519a9d20b1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - name: Start Temporal dev server
        # Started before the build so it is ready by the time the tests run. Its
        # in-memory store is private to this job: no other worker polls its queues.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/temporal.tar.gz" \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${TEMPORAL_CLI_SHA256}  $RUNNER_TEMP/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/temporal.tar.gz" -C "$RUNNER_TEMP" temporal
          nohup "$RUNNER_TEMP/temporal" server start-dev --headless --ip 127.0.0.1 --port 7233 \
            --log-level warn >"$RUNNER_TEMP/temporal.log" 2>&1 &
          for _ in $(seq 1 60); do
            if "$RUNNER_TEMP/temporal" operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1; then
              echo "temporal ready"; exit 0
            fi
            sleep 1
          done
          echo "::error title=Temporal::the dev server did not become ready"
          cat "$RUNNER_TEMP/temporal.log"
          exit 1
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Temporal server log
        if: failure()
        run: cat "$RUNNER_TEMP/temporal.log" || true

  docker:
    name: docker build (${{ matrix.arch }})
    # Native runners per architecture: the release publishes both (arm64 for Graviton).
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ghcr.io/qdequele/glutony:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test binaries
        run: |
          for bin in meili-ingest-gateway meili-ingest-control-plane meili-ingest-worker; do
            docker run --rm --entrypoint /usr/bin/test ghcr.io/qdequele/glutony:ci -x /usr/local/bin/$bin
          done

  lab-contract-drift:
    name: Lab contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the vendored schema with the Lab's
        # meilisearch/lab is private: LAB_REPO_TOKEN is a fine-grained PAT with
        # read access to its contents. Without it (forks, missing secret) the check
        # is skipped loudly rather than failing every PR.
        env:
          LAB_REPO_TOKEN: ${{ secrets.LAB_REPO_TOKEN }}
          LAB_SCHEMA_URL: https://raw.githubusercontent.com/meilisearch/lab/main/contracts/lab-events.schema.json
        run: |
          if [ -z "$LAB_REPO_TOKEN" ]; then
            echo "::notice title=Lab contract drift::LAB_REPO_TOKEN is not set; skipping the drift check"
            exit 0
          fi
          curl -fsSL -H "Authorization: Bearer $LAB_REPO_TOKEN" "$LAB_SCHEMA_URL" -o /tmp/lab-events.schema.json
          diff -u /tmp/lab-events.schema.json contracts/vendor/lab/lab-events.schema.json
