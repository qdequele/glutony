name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meili_ingest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the control-plane DB tests (they are #[ignore]d without it).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/meili_ingest_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test (DB-backed, ignored by default)
        run: cargo test -p meili-ingest-control-plane -- --ignored

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/meilisearch/meili-ingest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test binaries
        run: |
          for bin in meili-ingest-gateway meili-ingest-control-plane meili-ingest-worker; do
            docker run --rm --entrypoint /usr/bin/test ghcr.io/meilisearch/meili-ingest:ci -x /usr/local/bin/$bin
          done

  lab-contract-drift:
    name: Lab contract drift
    # Disabled until the Lab publishes a lab-events schema that includes glutony
    # (docs/superpowers/specs/2026-10-01-lab-ready-seams-design.md §5.7). Then set
    # LAB_SCHEMA_URL to its raw URL on meilisearch/lab main and remove this `if`.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the vendored schema with the Lab's
        env:
          LAB_SCHEMA_URL: https://raw.githubusercontent.com/meilisearch/lab/main/contracts/lab-events.schema.json
        run: |
          curl -fsSL "$LAB_SCHEMA_URL" -o /tmp/lab-events.schema.json
          diff -u /tmp/lab-events.schema.json contracts/vendor/lab/lab-events.schema.json
