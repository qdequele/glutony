# =====================================================================================
# NOT PRODUCTION PRICES: every value below is a list-price PLACEHOLDER (public OpenAI
# list prices at the time of writing), not what this deployment pays. Replace them
# with your negotiated prices BEFORE reporting usage to a Meilisearch Lab: the Lab
# bills provider_cost_micro_usd with its markup, so a wrong price here is a wrong bill.
# jev_enricher has no entry at all: its calls are billed at 0 and flagged unpriced
# until you fill in the [jev_enricher.default] template at the end of this file. The
# worker logs an error at boot for every registered provider plugin with no entry
# (or only zero prices).
# =====================================================================================
#
# What glutony pays a provider per call, in micro-USD (1 USD = 1_000_000).
# Keys: [<plugin name>.<model>] or [<plugin name>.default]. Dimensions:
# input_per_mtok, output_per_mtok (per million tokens), per_audio_second, per_request.
#
# The prices assume OpenAI, the provider the LLM, captioning and transcription plugins
# default to; Jev (TypeSafe) has no bundled price. Ship your own file
# (PROVIDER_COSTS_FILE) if a plugin's *_BASE_URL points elsewhere.
# A model missing here is billed at 0 and flagged (unpriced_provider_calls in the
# Lab event, "provider cost incomplete" in its description).

[llm_enricher."gpt-4o-mini"]
input_per_mtok = 150000
output_per_mtok = 600000

[llm_enricher."gpt-4o"]
input_per_mtok = 2500000
output_per_mtok = 10000000

[image_captioner."gpt-4o-mini"]
input_per_mtok = 150000
output_per_mtok = 600000

[image_captioner."gpt-4o"]
input_per_mtok = 2500000
output_per_mtok = 10000000

[whisper_transcriber."whisper-1"]
per_audio_second = 100

# jev_enricher (TypeSafe Jev) has no public price: left out on purpose, so its calls
# are flagged as unpriced until you add [jev_enricher.default] or a model entry.
# Template: uncomment, then replace each <...> with a real price. An unedited line is
# not valid TOML, so the worker refuses to boot rather than bill Jev at 0. If TypeSafe
# bills per call, keep only per_request. With per-token prices, a call TypeSafe returns
# without token counts is flagged unpriced (per_request is not billed for it).
# Delete the lines you do not use.
# [jev_enricher.default]
# input_per_mtok = <micro-USD per 1M input tokens>
# output_per_mtok = <micro-USD per 1M output tokens>
# per_request = <micro-USD per call>
